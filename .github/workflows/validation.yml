name: Validation

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install hooks script permissions
        run: chmod +x scripts/solocode-validate scripts/validate_rust_cutover_boundary.sh
      - name: Run Solo Code validation
        run: scripts/solocode-validate --trigger ciFull --workspace "$GITHUB_WORKSPACE" --format text
