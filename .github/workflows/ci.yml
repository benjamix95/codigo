# CI principale: validazione Swift/Xcode (solocode-validate ciFull) + workspace Rust.
name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-swift:
    name: macOS — Xcode (ciFull)
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Installa Codex CLI per suite wire-level
        if: env.CODEX_AUTH_JSON != ''
        run: npm install -g @openai/codex@0.117.0

      - name: Seeda auth Codex per test wire-level
        if: env.CODEX_AUTH_JSON != ''
        run: |
          mkdir -p "$HOME/.codex"
          cat > "$HOME/.codex/auth.json" <<'EOF'
          ${{ secrets.CODEX_AUTH_JSON }}
          EOF

      - name: Permessi script di validazione
        run: chmod +x scripts/solocode-validate scripts/validate_rust_cutover_boundary.sh

      - name: solocode-validate — trigger ciFull
        run: scripts/solocode-validate --trigger ciFull --workspace "$GITHUB_WORKSPACE" --format text

  rust-linux:
    name: Linux — Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Native

      - name: cargo clippy
        working-directory: Native
        run: cargo clippy --workspace --all-targets

      - name: cargo test
        working-directory: Native
        run: cargo test --workspace
