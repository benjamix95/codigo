[package]
name = "coderide_mcp_server_rust"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "coderide-mcp-server-rust"
path = "src/main.rs"

[dependencies]
app_core_protocol = { path = "../AppCoreProtocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solocode_rust_core = { path = "../RustCore" }
chrono = "0.4"
regex = "1"
